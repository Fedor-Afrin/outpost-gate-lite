name: Build and Push to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # ручной запуск из вкладки Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 for NanoPi / Raspberry Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OutpostGate Lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fedor-afrin/outpost-gate-lite:latest
            ghcr.io/fedor-afrin/outpost-gate-lite:${{ github.ref_name }}
            ghcr.io/fedor-afrin/outpost-gate-lite:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Fedor-Afrin/outpost-gate-lite
            org.opencontainers.image.title=OutpostGate Lite
            org.opencontainers.image.licenses=GPL-2.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
